<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Update deadline and maintenance window timeline</title>
  <desc id="desc">Timeline showing update discovery, background install, pending restart, preferred maintenance window restart, and deadline enforcement if the window is missed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">The window is preferred. The deadline is the backstop.</text>
  <text x="70" y="116" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18">Design the policy so devices see several overnight windows before deadline enforcement.</text>

  <line x1="105" y1="290" x2="1085" y2="290" stroke="#334155" stroke-width="8" stroke-linecap="round"/>
  <line x1="105" y1="290" x2="1085" y2="290" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <circle cx="150" cy="290" r="18" fill="#38bdf8"/>
    <rect x="70" y="165" width="205" height="90" rx="14" fill="#0b1220" stroke="#1e3a8a"/>
    <text x="95" y="200" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Update discovered</text>
    <text x="95" y="229" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Deadline clock starts</text>
  </g>

  <g>
    <circle cx="395" cy="290" r="18" fill="#38bdf8"/>
    <rect x="305" y="325" width="220" height="104" rx="14" fill="#0b1220" stroke="#1e3a8a"/>
    <text x="330" y="361" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Download/install</text>
    <text x="330" y="390" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Can happen before the</text>
    <text x="330" y="414" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">maintenance window</text>
  </g>

  <g>
    <circle cx="635" cy="290" r="18" fill="#22c55e"/>
    <rect x="535" y="145" width="250" height="110" rx="14" fill="#0b1220" stroke="#065f46"/>
    <text x="560" y="181" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Pending restart</text>
    <text x="560" y="210" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Maintenance window</text>
    <text x="560" y="234" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">catches the reboot</text>
  </g>

  <g>
    <circle cx="830" cy="290" r="18" fill="#22c55e"/>
    <rect x="735" y="325" width="245" height="104" rx="14" fill="#0b1220" stroke="#065f46"/>
    <text x="760" y="361" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Overnight reboot</text>
    <text x="760" y="390" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Expected user-impact</text>
    <text x="760" y="414" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">path</text>
  </g>

  <g>
    <circle cx="1030" cy="290" r="18" fill="#f97316"/>
    <rect x="925" y="145" width="220" height="110" rx="14" fill="#0b1220" stroke="#92400e"/>
    <text x="950" y="181" fill="#f8fafc" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Deadline reached</text>
    <text x="950" y="210" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">Only if the device misses</text>
    <text x="950" y="234" fill="#cbd5e1" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="14">the safer windows</text>
  </g>

  <rect x="445" y="462" width="410" height="66" rx="24" fill="#052e2b" stroke="#10b981"/>
  <text x="650" y="489" text-anchor="middle" fill="#d1fae5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Target state</text>
  <text x="650" y="513" text-anchor="middle" fill="#d1fae5" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700">Reboot before the hard deadline matters</text>
</svg>
