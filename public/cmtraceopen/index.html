<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta property="og:url" content="https://adamgell.com/cmtraceopen/" />
    <link rel="canonical" href="https://adamgell.com/cmtraceopen/" />
    <title>CMTrace Open Builds</title>
    <link rel="stylesheet" href="./styles.css?v=20260513-concept-b-real" />
  </head>
  <body>
    <div class="shell">
      <header class="page-head">
        <div class="brand-lockup">
          <img class="logo-mark" src="../images/cmtrace-logo.png" alt="" />
          <h1>CMTrace Open Builds</h1>
        </div>
        <div class="publish-badge" aria-label="Nightly publication status">
          <span class="status-chip" id="nightly-publish-chip">Checking</span>
          <div class="publish-copy">
            <strong id="nightly-publish-title">Loading GitHub</strong>
            <span id="nightly-publish-meta">Fetching release data</span>
          </div>
          <button class="sync-button" type="button" id="refresh-button" aria-label="Refresh build data">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M20 12a8 8 0 0 1-13.3 6l-1.2 1.2H2v-3.5l1.9-1.9h3.5L5.2 16A6 6 0 0 0 18 12h2ZM4 12A8 8 0 0 1 17.3 6l1.2-1.2H22v3.5l-1.9 1.9h-3.5L18.8 8A6 6 0 0 0 6 12H4Z" fill="currentColor" />
            </svg>
          </button>
        </div>
      </header>

      <main>
        <section class="build-card" aria-labelledby="nightly-heading">
          <div id="nightly-release" class="loading-block">
            <p id="nightly-heading">Loading nightly release.</p>
          </div>
        </section>

        <section id="stable-release" class="stable-card loading-block" aria-label="Latest stable release">
          <div>
            <p>Loading latest release.</p>
          </div>
        </section>
      </main>

      <footer class="footer">
        <span id="api-state">Waiting on GitHub API.</span>
        <span>Public data from adamgell/cmtraceopen.</span>
      </footer>
    </div>

    <script src="./app.js?v=20260513-concept-b-real" type="module"></script>
  </body>
</html>
